# Mosquitto configuration for local development.
#
# This is intentionally permissive so the simulators and web app "just work" against a
# local broker. Do NOT reuse this as-is on the Synology NAS: for production, disable
# anonymous access and add authentication (password file or TLS) instead.

# Plain MQTT.
listener 1883
protocol mqtt

# MQTT over WebSockets (useful for browser-based MQTT debugging tools).
listener 9001
protocol websockets

# Local-dev only: allow clients to connect without credentials.
allow_anonymous true

# Persist retained messages / session state across restarts.
persistence true
persistence_location /mosquitto/data/

# Log to stdout so `docker compose logs mosquitto` shows activity.
log_dest stdout
log_type all
